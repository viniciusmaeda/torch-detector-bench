experiment:
  seed: 42
  output_dir: results
  name: fish_cv5_seed42

cross_validation:
  enabled: true
  n_splits: 5
  strategy: iterative_multilabel
  checkpoint: last
  # Optional CSV with image_id,group_id for related images; never inferred from filenames.
  group_file: null

statistics:
  primary_metric: mAP50_95
  comparison_metrics: [mAP50_95, mAP50, F1, MAE, RMSE]
  required_models: [yolo, rtdetr, fasterrcnn, detr]
  alpha: 0.05


training:
  # Shared defaults applied to every model unless overridden below.
  epochs: 100
  log_interval: 10

  # Shared dataloader / image defaults.
  batch_size: 4
  num_workers: 4
  image_size: 640
  qualitative_images: 6

models:
  yolo:
    # Supported YOLO models:
    # yolov8n.pt, yolov8s.pt, yolov8m.pt, yolov8l.pt, yolov8x.pt
    # yolo11n.pt, yolo11s.pt, yolo11m.pt, yolo11l.pt, yolo11x.pt
    # yolo26n.pt, yolo26s.pt, yolo26m.pt, yolo26l.pt, yolo26x.pt
    model_name: yolov8m.pt
    training:
      optimizer: AdamW # Supported optimizers: SGD, Adam, AdamW, RMSProp
      learning_rate: 0.001
      weight_decay: 0.001
      momentum: 0.937
      batch_size: 4
      num_workers: 4
      image_size: 640

  rtdetr:
    # Supported RT-DETR models:
    # rtdetr-l.pt, rtdetr-x.pt
    model_name: rtdetr-l.pt
    training:
      optimizer: AdamW # Supported optimizers: SGD, Adam, AdamW, RMSProp
      learning_rate: 0.001
      weight_decay: 0.001
      momentum: 0.9
      batch_size: 4
      num_workers: 4
      image_size: 640

  fasterrcnn:
    # Supported Faster R-CNN models:
    # fasterrcnn_resnet50_fpn
    # fasterrcnn_resnet50_fpn_v2
    # fasterrcnn_mobilenet_v3_large_fpn
    model_name: fasterrcnn_resnet50_fpn_v2
    training:
      optimizer: AdamW # Supported optimizers: SGD, Adam, AdamW, RMSProp
      learning_rate: 0.00005
      weight_decay: 0.0001
      momentum: 0.9
      batch_size: 2
      num_workers: 2
      image_size: 640
      
  detr:
    training:
      optimizer: AdamW # Supported optimizers: SGD, Adam, AdamW, RMSProp
      learning_rate: 0.00005
      backbone_learning_rate: 0.000005
      weight_decay: 0.0001
      grad_clip_norm: 0.1
      scheduler: MultiStepLR
      scheduler_milestones: [30, 60]
      scheduler_gamma: 0.1
      freeze_backbone: true
      momentum: 0.9
      batch_size: 1
      num_workers: 2
      image_size: 640
      qualitative_images: 4


evaluation:
  iou_threshold: 0.5
  score_threshold: 0.25
  # Retain low-score detections for COCO AP; fixed threshold above is for P/R/F1 and counts.
  ap_score_threshold: 0.001
  max_detections: 100
  warmup_batches: 2
  
  
dataset:
  root: datasets
  images: images/all
  annotations: images/all/_annotations.coco.json
  num_classes: 32
  class_names:
  - __background__
  - Truta-arco-iris
  - arqueiro
  - arraia
  - axolote
  - baiacu-verde
  - bananinha
  - cachara
  - canivete
  - cascudo
  - cascudo_chinelo
  - curimbata
  - diamante
  - dourado
  - jacare
  - jau
  - mono
  - noivinha
  - pacu
  - pacu_prata
  - palmitinho
  - piapara
  - pintado
  - piramboia
  - piranha
  - piraputanga
  - pirarucu
  - saia-branca
  - sardinha
  - saua
  - tetra-cego
  - zebrinha
